name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: false
      - name: Validate plugin package
        run: ./scripts/validate
      - name: Verify development signature
        run: codesign --verify --strict --verbose=2 plugins/billy-plugin/bin/darwin-arm64/billy-mcp
      - name: Check executable metadata
        run: plugins/billy-plugin/bin/darwin-arm64/billy-mcp --version
